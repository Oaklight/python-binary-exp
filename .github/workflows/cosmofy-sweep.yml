name: Cosmofy (Cosmopolitan APE) Sweep

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to build (comma-separated: llm-rosetta,tinyleaf or all)"
        default: "all"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tinyleaf
            compile_bytecode: "false"
            label: cosmo-leaf-nobc
          - target: tinyleaf
            compile_bytecode: "true"
            label: cosmo-leaf-bc
          - target: llm-rosetta
            compile_bytecode: "false"
            label: cosmo-rosetta-nobc
          - target: llm-rosetta
            compile_bytecode: "true"
            label: cosmo-rosetta-bc
    name: "${{ matrix.label }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install cosmofy
        run: uv tool install cosmofy

      - name: Prepare target project
        run: |
          TARGET=${{ matrix.target }}
          case "$TARGET" in
            llm-rosetta)
              git clone --depth=1 https://github.com/oaklight/llm-rosetta.git /tmp/target
              ;;
            tinyleaf)
              git clone --depth=1 https://github.com/oaklight/tinyleaf.git /tmp/target
              ;;
          esac

      - name: Fix dynamic version for cosmofy compatibility
        run: |
          cd /tmp/target
          # cosmofy calls `uv version` which can't handle dynamic versions
          # Extract version from source and make it static in pyproject.toml
          TARGET=${{ matrix.target }}
          case "$TARGET" in
            llm-rosetta)
              VER=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/llm_rosetta/__init__.py').read()).group(1))" 2>/dev/null || echo "0.0.0")
              ;;
            tinyleaf)
              VER=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/tinyleaf/__init__.py').read()).group(1))" 2>/dev/null || echo "0.0.0")
              ;;
          esac
          echo "Detected version: $VER"
          # Replace dynamic version with static
          sed -i 's/^dynamic = \["version"\]/version = "'"$VER"'"/' pyproject.toml
          # Remove the dynamic version source config
          sed -i '/\[tool\.setuptools\.dynamic\]/,/^$/d' pyproject.toml
          echo "=== patched pyproject.toml (version section) ==="
          grep -A2 "version" pyproject.toml | head -5

      - name: Build with cosmofy
        id: build
        run: |
          cd /tmp/target

          COSMOFY_FLAGS=""
          if [ "${{ matrix.compile_bytecode }}" = "true" ]; then
            COSMOFY_FLAGS="$COSMOFY_FLAGS --compile-bytecode"
          fi

          START_TIME=$(date +%s)
          cosmofy bundle $COSMOFY_FLAGS --output-dir /tmp/cosmofy-dist --verbose
          COSMOFY_EXIT=$?
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))

          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "cosmofy_exit=$COSMOFY_EXIT" >> "$GITHUB_OUTPUT"

          echo "=== cosmofy output dir ==="
          find /tmp/cosmofy-dist -type f 2>/dev/null || echo "No output directory"
          ls -lh /tmp/cosmofy-dist/ 2>/dev/null || true

      - name: Collect results
        if: always()
        run: |
          TARGET=${{ matrix.target }}
          BUILD_TIME="${{ steps.build.outputs.build_time }}"
          BUILD_TIME="${BUILD_TIME:-0}"
          mkdir -p build

          BINARY="$(find /tmp/cosmofy-dist -type f -print -quit 2>/dev/null || true)"

          if [ -z "$BINARY" ]; then
            echo "No binary in /tmp/cosmofy-dist, checking default dist/ in project..."
            BINARY="$(find /tmp/target/dist -type f -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$BINARY" ]; then
            echo "ERROR: No binary found anywhere"
            cat > "build/result-cosmofy-${TARGET}-${{ matrix.compile_bytecode }}.json" <<EOJSON
          {
            "target": "$TARGET",
            "compiler": "cosmofy",
            "compile_bytecode": ${{ matrix.compile_bytecode }},
            "libc": "cosmopolitan",
            "binary_size_bytes": 0,
            "build_time_seconds": $BUILD_TIME,
            "smoke_test_passed": false,
            "error": "no binary found"
          }
          EOJSON
            exit 0
          fi

          BINARY_SIZE=$(stat -c%s "$BINARY" 2>/dev/null || stat -f%z "$BINARY")
          SIZE_MB=$(echo "scale=2; $BINARY_SIZE / 1048576" | bc)

          echo "=== Smoke test ==="
          SMOKE_PASSED="false"
          chmod +x "$BINARY" 2>/dev/null || true
          if timeout 10 "$BINARY" --help >/dev/null 2>&1; then
            SMOKE_PASSED="true"
            echo "Smoke test PASSED"
          else
            echo "Smoke test FAILED (may need APE loader on this platform)"
          fi

          COSMOFY_VERSION="$(cosmofy --version 2>&1 || echo unknown)"

          cat > "build/result-cosmofy-${TARGET}-${{ matrix.compile_bytecode }}.json" <<EOJSON
          {
            "target": "$TARGET",
            "compiler": "cosmofy",
            "compile_bytecode": ${{ matrix.compile_bytecode }},
            "libc": "cosmopolitan",
            "binary_size_bytes": $BINARY_SIZE,
            "build_time_seconds": $BUILD_TIME,
            "smoke_test_passed": $SMOKE_PASSED,
            "cosmofy_version": "$COSMOFY_VERSION",
            "binary_path": "$BINARY",
            "binary_size_mb": "$SIZE_MB"
          }
          EOJSON

          SUFFIX=""
          if [ "${{ matrix.compile_bytecode }}" = "true" ]; then SUFFIX="-bc"; fi
          cp "$BINARY" "build/${TARGET}-cosmofy${SUFFIX}"

          echo "=== Result ==="
          cat "build/result-cosmofy-${TARGET}-${{ matrix.compile_bytecode }}.json"
          echo ""
          echo "Binary: ${TARGET} — ${SIZE_MB} MB (cosmopolitan APE, cross-platform)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cosmofy-${{ matrix.label }}"
          path: |
            build/result-*.json
            build/${{ matrix.target }}-*
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          RESULT_FILE=$(ls build/result-*.json 2>/dev/null | head -1)
          if [ -n "$RESULT_FILE" ]; then
            RESULT=$(cat "$RESULT_FILE")
            SIZE=$(echo "$RESULT" | jq -r '.binary_size_bytes // "0"')
            TIME=$(echo "$RESULT" | jq -r '.build_time_seconds // "0"')
            SMOKE=$(echo "$RESULT" | jq -r '.smoke_test_passed // "false"')
            ERROR=$(echo "$RESULT" | jq -r '.error // ""')
            if [ "$SIZE" != "0" ] && [ "$SIZE" != "null" ]; then
              SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
              SIZE_DISPLAY="${SIZE_MB} MB"
            else
              SIZE_DISPLAY="N/A (build failed: ${ERROR})"
            fi
            echo "### ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Target | ${{ matrix.target }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Bytecode Compilation | ${{ matrix.compile_bytecode }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform | Cosmopolitan APE (Linux+macOS+Windows) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Binary Size | ${SIZE_DISPLAY} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Build Time | ${TIME}s |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Smoke Test | ${SMOKE} |" >> "$GITHUB_STEP_SUMMARY"
          fi
